[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boltz2parallel"
version = "1.0.0"
description = "Profile-driven multi-GPU toolkit for large-scale Boltz inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Boltz2Parallel contributors" }]
keywords = [
    "boltz",
    "boltz2",
    "protein-structure",
    "gpu-scheduling",
    "bioinformatics",
    "singularity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "PyYAML>=5.4",
]

[project.optional-dependencies]
extras = [
    "psutil>=5.9",
]

[project.scripts]
boltz2parallel = "boltz2parallel.cli.main:main"
boltz2parallel-run = "boltz2parallel._entrypoints:run_parallel"
boltz2parallel-profile = "boltz2parallel._entrypoints:run_gpu_memory_profiler"
boltz2parallel-profile-ts = "boltz2parallel._entrypoints:run_gpu_memory_timeseries_profiler"
boltz2parallel-yaml-generate = "boltz2parallel._entrypoints:run_yaml_generator"
boltz2parallel-yaml-add-msa = "boltz2parallel._entrypoints:run_yaml_add_msa"

[project.urls]
Homepage = "https://github.com/Xin-DongXu/Boltz2Parallel"
Repository = "https://github.com/Xin-DongXu/Boltz2Parallel"
Issues = "https://github.com/Xin-DongXu/Boltz2Parallel/issues"
Documentation = "https://github.com/Xin-DongXu/Boltz2Parallel/tree/main/docs"
Related = "https://github.com/Xin-DongXu/AF3Parallel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
boltz2parallel = ["data/*.tsv"]
